<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="IE=edge" http-equiv="X-UA-Compatible"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex, follow" name="robots"/>
<title id="pageTitle">Write-up — Kareem Tamer</title>
<link href="assets/logo.png" rel="icon" sizes="16x16" type="image/x-icon"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&amp;family=Rajdhani:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
    :root {
        --bg: #101622;
        --bg-alt: #0a0f1a;
        --green: #23ae62;
        --text-body: #94a3b8;
        --text-heading: #e6f4ec;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text-body);
        font-family: 'Sora', sans-serif;
        overflow-x: hidden;
    }
    a { text-decoration: none; }

    /* ---- top bar ---- */
    .wp-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border-bottom: 1px solid rgba(35, 174, 98, 0.2);
        background: var(--bg-alt);
        position: sticky;
        top: 0;
        z-index: 10;
    }
    .wp-topbar .brand {
        font-family: 'Sora', sans-serif;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--text-heading);
    }
    .wp-topbar .brand span { color: var(--green); }
    .wp-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border: 1px solid rgba(35, 174, 98, 0.35);
        border-radius: 999px;
        color: var(--green);
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.25s ease;
    }
    .wp-back:hover {
        background: rgba(35, 174, 98, 0.12);
        border-color: var(--green);
    }

    /* ---- header ---- */
    .wp-header {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 24px 0;
    }
    .wp-cover {
        width: 100%;
        aspect-ratio: 16 / 7;
        object-fit: cover;
        border-radius: 14px;
        border: 1px solid rgba(35, 174, 98, 0.3);
        display: block;
    }
    .wp-title {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        color: var(--text-heading);
        margin: 28px 0 10px;
    }
    .wp-title span { color: var(--green); }
    .wp-desc {
        font-size: 1rem;
        line-height: 1.7;
        color: var(--text-body);
        margin: 0 0 30px;
        padding-bottom: 30px;
        border-bottom: 1px solid rgba(35, 174, 98, 0.2);
    }

    /* ---- markdown content ---- */
    .wp-content {
        max-width: 900px;
        margin: 0 auto;
        padding: 10px 24px 80px;
        font-size: 1rem;
        line-height: 1.8;
        color: #cbd5e1;
    }
    .wp-content h1, .wp-content h2, .wp-content h3, .wp-content h4 {
        font-family: 'Sora', sans-serif;
        color: var(--green);
        margin-top: 1.8em;
        margin-bottom: 0.6em;
        line-height: 1.3;
    }
    .wp-content h1:first-child,
    .wp-content h2:first-child,
    .wp-content h3:first-child { margin-top: 0; }
    .wp-content a { color: var(--green); text-decoration: underline; }
    .wp-content p { margin: 0 0 1.1em; }
    .wp-content code {
        background: rgba(35, 174, 98, 0.12);
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 0.88em;
    }
    .wp-content pre {
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(35, 174, 98, 0.22);
        border-radius: 10px;
        padding: 18px 20px;
        overflow-x: auto;
        margin: 0 0 1.3em;
    }
    .wp-content pre code {
        background: none;
        padding: 0;
    }
    .wp-content img {
        max-width: 100%;
        border-radius: 10px;
        border: 1px solid rgba(35, 174, 98, 0.25);
        margin: 14px 0;
        display: block;
    }
    .wp-content ul, .wp-content ol {
        padding-left: 1.5em;
        margin: 0 0 1.1em;
    }
    .wp-content li { margin-bottom: 0.4em; }
    .wp-content blockquote {
        border-left: 3px solid var(--green);
        margin: 0 0 1.1em;
        padding: 4px 0 4px 16px;
        color: var(--text-body);
    }
    .wp-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 1.3em;
    }
    .wp-content th, .wp-content td {
        border: 1px solid rgba(35, 174, 98, 0.25);
        padding: 8px 12px;
        text-align: left;
    }
    .wp-content th {
        background: rgba(35, 174, 98, 0.1);
        color: var(--green);
    }
    .wp-loading, .wp-error {
        color: var(--text-body);
        font-style: italic;
    }
</style>
</head>
<body>

<div class="wp-topbar">
    <div class="brand">Kareem Tamer <span>| Cyber Security</span></div>
    <a class="wp-back" href="index.html#d2c_portfolio"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
</div>

<div class="wp-header">
    <img alt="" class="wp-cover" id="wpCover" src=""/>
    <h1 class="wp-title" id="wpTitle"></h1>
    <p class="wp-desc" id="wpDesc"></p>
</div>

<div class="wp-content" id="wpContent">
    <p class="wp-loading">Loading write-up...</p>
</div>

<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var folder = params.get('f') || '';
        var cover = params.get('img') || '';
        var title = params.get('t') || '';
        var desc = params.get('d') || '';

        document.title = (title ? title + ' — ' : '') + 'Kareem Tamer';
        document.getElementById('wpTitle').textContent = title;
        document.getElementById('wpDesc').textContent = desc;
        var coverEl = document.getElementById('wpCover');
        if (cover) {
            coverEl.src = cover;
        } else {
            coverEl.style.display = 'none';
        }

        var contentEl = document.getElementById('wpContent');

        if (!folder) {
            contentEl.innerHTML = '<p class="wp-error">No write-up specified.</p>';
            return;
        }

        var mdPath = 'assets/' + folder + '/writeup.md';
        var imagesBase = 'assets/' + folder + '/images/';

        // Custom renderer so relative image paths in the markdown
        // (e.g. "photo.png" or "images/photo.png") always resolve to
        // assets/<folder>/images/, regardless of how they were written.
        var renderer = new marked.Renderer();
        renderer.image = function (href, imgTitle, text) {
            var src = href;
            var isAbsolute = /^([a-z][a-z0-9+.-]*:)?\/\//i.test(href) || href.indexOf('/') === 0;
            if (!isAbsolute) {
                var cleaned = href.replace(/^\.?\/?images\//, '');
                src = imagesBase + cleaned;
            }
            var titleAttr = imgTitle ? ' title="' + imgTitle + '"' : '';
            return '<img src="' + src + '" alt="' + (text || '') + '"' + titleAttr + '>';
        };

        fetch(mdPath)
            .then(function (r) {
                if (!r.ok) throw new Error('not found');
                return r.text();
            })
            .then(function (md) {
                contentEl.innerHTML = marked.parse(md, { renderer: renderer });
            })
            .catch(function () {
                contentEl.innerHTML = '<p class="wp-error">Could not load this write-up. Please check back later.</p>';
            });
    })();
</script>
</body>
</html>
